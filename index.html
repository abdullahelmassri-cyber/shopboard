<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopBoard: everything your shop needs, in one board." />
    <title>ShopBoard</title>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">ShopBoard</a>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="#products">Shop</a></li>
          <li><a href="#register">Sign up</a></li>
        </ul>
      </nav>
      <p class="cart">Cart: <span id="cart-count">0</span></p>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Sell smarter.</h1>
        <p>Everything your shop needs, in one board.</p>
        <a class="button" href="#products">Shop now</a>
      </section>

      <section id="products" class="products" aria-labelledby="products-title">
        <h2 id="products-title">Products</h2>
        <div class="grid" id="product-grid"></div>
      </section>

      <section id="register" class="register" aria-labelledby="register-title">
        <h2 id="register-title">Create your account</h2>
        <form class="form">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="password-hint"
              required
            />
            <p id="password-hint" class="hint">At least 8 characters.</p>
          </div>
          <div class="field field-check">
            <input id="terms" name="terms" type="checkbox" required />
            <label for="terms">I agree to the terms</label>
          </div>
          <button type="submit">Create account</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 ShopBoard</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
